kind = "web"
previewPath = "/"
title = "Birthday Love"
description = "A romantic birthday surprise website made to celebrate someone special with heartfelt messages, memories, and a playful reveal."
version = "1.0.0"
id = "artifacts/birthday-love"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20131

[services.development]
run = "pnpm --filter @workspace/birthday-love run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/birthday-love", "run", "build" ]
serve = "static"
publicDir = "artifacts/birthday-love/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20131"
BASE_PATH = "/"
